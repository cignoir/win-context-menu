[package]
name = "win-context-menu"
version = "0.1.3"
edition = "2021"
rust-version = "1.80"
authors = ["cignoir"]
description = "Show and interact with Windows Explorer context menus programmatically"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cignoir/win-context-menu"
homepage = "https://github.com/cignoir/win-context-menu"
documentation = "https://docs.rs/win-context-menu"
keywords = ["windows", "context-menu", "shell", "explorer", "com"]
categories = ["os::windows-apis", "gui"]
readme = "README.md"
exclude = ["/.github/", "/target/"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[dependencies]
thiserror = "2.0"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
]

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.serde]
version = "1"
optional = true
features = ["derive"]

[dependencies.serde_json]
version = "1"
optional = true

[features]
default = []
ffi = ["dep:serde_json"]
tracing = ["dep:tracing"]
serde = ["dep:serde"]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "multi_select"
path = "examples/multi_select.rs"

[[example]]
name = "folder_background"
path = "examples/folder_background.rs"

[[example]]
name = "extended"
path = "examples/extended.rs"

[[example]]
name = "enumerate"
path = "examples/enumerate.rs"
